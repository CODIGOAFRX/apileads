# Comprobaciones automáticas en cada push y pull request: si algo se rompe, GitHub lo marca en rojo.
name: Pruebas

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    # El servidor (lead.grupoefp.es) va con PHP 8.3: un fallo solo en 8.1 avisa pero no frena el despliegue.
    continue-on-error: ${{ matrix.php == '8.1' }}
    strategy:
      fail-fast: false
      matrix:
        # 8.1 es el mínimo que admite el servidor (Plesk); 8.4 la más nueva.
        php: ['8.1', '8.3', '8.4']
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_DATABASE: apileads_test
          MARIADB_USER: apileads
          MARIADB_PASSWORD: apileads
          MARIADB_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_mysql, pdo_sqlite, zip, gd, openssl
          coverage: none
      - name: Dependencias
        run: composer install --no-interaction --no-progress
      - name: Las dependencias de producción funcionan en este PHP
        run: composer check-platform-reqs --no-dev
      - name: Pruebas (SQLite)
        run: vendor/bin/phpunit
      - name: Pruebas (MariaDB, el motor del servidor)
        env:
          TEST_DB_DSN: mysql:host=127.0.0.1;port=3306;dbname=apileads_test;charset=utf8mb4
          TEST_DB_USER: apileads
          TEST_DB_PASSWORD: apileads
        run: vendor/bin/phpunit
      - name: Análisis estático (PHPStan)
        if: matrix.php == '8.3'
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Revisión del código (ESLint)
        run: npm run lint
      - name: Pruebas (lógica y componentes)
        run: npm test
      - name: Compilación
        run: npm run build

  # Con todo en verde en main, publica la rama "produccion": la aplicación ya compilada (frontend/dist y
  # backend/vendor sin herramientas de pruebas), que es de donde tira Plesk (Git → despliegue automático).
  # El backend/.env de producción no está aquí: se sube una vez a mano al servidor y el despliegue no lo toca.
  produccion:
    name: Rama de despliegue
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, pdo_mysql, zip, gd
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Compilación del frontend
        working-directory: frontend
        run: npm ci && npm run build
      - name: Carpeta de la aplicación
        # Lo mismo que preparar-plesk.sh, sin el .env ni la base de datos.
        run: |
          mkdir -p out/frontend out/backend/storage/logs
          cp -r frontend/dist out/frontend/dist
          cp -r backend/bin backend/database backend/public backend/src \
                backend/composer.json backend/composer.lock backend/.htaccess out/backend/
          cp backend/storage/logs/.gitkeep out/backend/storage/logs/
          rm -f out/backend/bin/{admin-local,demo,dev-router,limpiar-pruebas,preparar-plesk}.php \
                out/backend/database/docker-init.sql
          (cd out/backend && composer install --no-dev --optimize-autoloader --no-interaction --no-progress)
      - name: Publicar la rama produccion
        working-directory: out
        run: |
          git init -q -b produccion
          git config user.name "github-actions[bot]"
          git config user.email "41898802+github-actions[bot]@users.noreply.github.com"
          git add -A -f .
          git commit -q -m "Despliegue de main @ ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" produccion
