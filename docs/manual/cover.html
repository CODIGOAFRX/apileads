<!doctype html><html lang="es"><head><meta charset="utf-8">
<style>
@font-face { font-family: 'HN'; src: url('FONTS/HelveticaNeue-Light.woff2'); font-weight: 300; }
@font-face { font-family: 'HN'; src: url('FONTS/HelveticaNeueBd.woff2'); font-weight: 700; }
@page { size: A4; margin: 0; }
html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
body { margin: 0; }
.cover { position: relative; width: 210mm; height: 297mm; background: #1F201D; color: #fff; font-family: 'HN', Arial, sans-serif; overflow: hidden; }
.line { position: absolute; left: 16mm; top: 0; bottom: 0; width: 7px; background: #fff; border-radius: 4px; }
.dot { position: absolute; left: calc(16mm - 9px); width: 25px; height: 25px; border-radius: 50%; background: #fff; display: flex; align-items: center; justify-content: center; }
.dot i { width: 11px; height: 11px; border-radius: 50%; display: block; }
.logo { position: absolute; left: 31mm; top: 21mm; height: 13mm; filter: invert(1); }
h1 { position: absolute; left: 28mm; top: 80mm; margin: 0; font-size: 118pt; font-weight: 700; letter-spacing: -.05em; line-height: 1; }
.tag { position: absolute; left: 31mm; top: 128mm; background: #00FF81; color: #1F201D; font-weight: 700; font-size: 21pt; letter-spacing: -.02em; padding: 4px 16px 3px; border-radius: 0 16px 0 16px; }
.sub { position: absolute; left: 31mm; top: 148mm; font-size: 12.5pt; font-weight: 300; line-height: 1.5; width: 140mm; }
.ed { position: absolute; left: 31mm; top: 168mm; font-size: 9pt; font-weight: 700; letter-spacing: .2em; color: #FFFF82; }
.bars { position: absolute; left: 31mm; bottom: 26mm; display: flex; gap: 6px; }
.bars i { width: 13mm; height: 3mm; display: block; }
.foot { position: absolute; left: 31mm; bottom: 14mm; font-size: 7pt; font-weight: 700; letter-spacing: .24em; color: #b9b9b2; }
</style></head><body>
<div class="cover">
  <div class="line"></div>
  <div class="dot" style="top:24mm"><i style="background:#1F201D"></i></div>
  <div class="dot" style="top:92mm"><i style="background:#00FF81"></i></div>
  <div class="dot" style="top:166mm"><i style="background:#8CE5FF"></i></div>
  <div class="dot" style="top:238mm"><i style="background:#FFFF82"></i></div>
  <img class="logo" src="LOGO" alt="Estación Diseño">
  <h1>LEADS</h1>
  <div class="tag">MANUAL DEL EQUIPO COMERCIAL</div>
  <div class="sub">Cómo funciona la web de leads, paso a paso y con ejemplos: llamar, apuntar, hacer seguimiento y no perder a nadie.</div>
  <div class="ed">EDICIÓN OCTUBRE 2026 · ACTUALIZADA CON ESTACIÓN DISEÑO Y GRUPO EFP</div>
  <div class="bars"><i style="background:#00FF81"></i><i style="background:#FF79F5"></i><i style="background:#FF7A78"></i><i style="background:#8A86FF"></i><i style="background:#FFFF82"></i><i style="background:#8CE5FF"></i><i style="background:#D06EFA"></i><i style="background:#FFA83D"></i></div>
  <div class="foot">ESTACIÓN DISEÑO · ESCUELA SUPERIOR DE DISEÑO · EDICIÓN OCTUBRE 2026</div>
</div></body></html>
